name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Statische Prüfung (vergessene Funktionen, doppelte Namen)
        run: npx --yes eslint@9 server.js lib test
      - name: Spieltests mit Bot-Spielern (Buzzer, Joker, Finale, Mini-Games ...)
        run: npm test
