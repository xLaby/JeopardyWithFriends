<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jeopardy-Quiz</title>
<style>
:root{--bg:#1d1d1f;--panel:#2a2a2d;--pink:#ff78b9;--red:#cc3030;--red-dark:#7d2222;--text:#f4f4f4;--muted:#a8a8ad;--ok:#3fb86b}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button,input{font:inherit}
button{cursor:pointer;border:0;border-radius:10px;padding:.7em 1.1em;font-weight:700;background:var(--pink);color:#000}
button:hover{filter:brightness(1.08)}
button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:2px}
button.ghost{background:transparent;color:var(--text);border:2px solid #555}
button.ok{background:var(--ok)} button.bad{background:var(--red);color:#fff}
button:disabled{opacity:.45;cursor:not-allowed}
input[type=text]{width:100%;padding:.8em 1em;border-radius:10px;border:2px solid #444;background:#111;color:var(--text);font-size:1.1rem}
h1,h2{margin:0 0 .4em;letter-spacing:.01em}
.center{text-align:center}
.wrap{max-width:520px;margin:0 auto;padding:24px 18px}
.stack>*+*{margin-top:14px}
.panel{background:var(--panel);border-radius:14px;padding:18px}
.muted{color:var(--muted)}
.err{color:#ff8a8a;min-height:1.3em}
.code{font-size:3.2rem;font-weight:900;letter-spacing:.18em;color:var(--pink)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.plist{list-style:none;margin:0;padding:0}
.plist li{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #3a3a3e}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ok);margin-right:8px}
.dot.off{background:#777}
/* Host-Board */
.top{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 14px;flex-wrap:wrap}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--panel);border:2px solid transparent;border-radius:10px;padding:6px 12px;cursor:pointer;color:var(--text);font-weight:400;text-align:left}
.chip b{display:block;font-size:1.15rem}
.chip.turn{border-color:var(--pink)}
.chip.off{opacity:.5}
.board{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:4px;padding:6px 14px 18px}
.cat{background:var(--pink);color:#000;border-radius:10px;font-weight:700;font-size:clamp(.6rem,1.05vw,1rem);text-align:center;padding:8px 4px;display:flex;align-items:center;justify-content:center;min-height:56px;overflow-wrap:anywhere}
.tile{background:var(--red);color:#000;border-radius:2px;font-weight:900;font-size:clamp(1rem,2.8vw,2.6rem);height:clamp(48px,8.2vh,92px);display:flex;align-items:center;justify-content:center;padding:0}
.tile:hover:not(:disabled){filter:brightness(1.18)}
.tile:disabled{background:#2a2a2d;color:transparent;opacity:1;cursor:default}
.tile.none{visibility:hidden}
/* Overlay / Frage */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;padding:18px;z-index:5}
.card{background:var(--red);color:#fff;border-radius:18px;padding:28px;max-width:900px;width:100%;max-height:100%;overflow:auto}
.card .meta{font-weight:700;opacity:.85;margin-bottom:10px}
.card .q{font-size:clamp(1.4rem,3.6vw,2.6rem);font-weight:800;line-height:1.25;overflow-wrap:anywhere}
.card .a{margin-top:18px;padding:12px 14px;background:rgba(0,0,0,.28);border-radius:10px;font-size:1.15rem}
.card .status{margin-top:18px;font-size:1.2rem;font-weight:700}
.card .btns{margin-top:20px;display:flex;gap:10px;flex-wrap:wrap}
.card button.ghost{border-color:#fff;color:#fff}
/* Spieler */
.pgame{max-width:560px;margin:0 auto;padding:14px;display:flex;flex-direction:column;gap:14px;min-height:100vh}
.me{display:flex;justify-content:space-between;align-items:baseline;background:var(--panel);border-radius:12px;padding:12px 16px}
.me b{font-size:1.5rem;color:var(--pink)}
.pq{background:var(--red);border-radius:16px;padding:20px}
.pq .meta{font-weight:700;opacity:.85;margin-bottom:8px}
.pq .q{font-size:1.5rem;font-weight:800;line-height:1.3;overflow-wrap:anywhere}
.wait{padding:30px 10px;text-align:center;color:var(--muted);font-size:1.15rem}
.buzz{width:min(62vw,240px);aspect-ratio:1;border-radius:50%;background:var(--pink);color:#000;font-size:2rem;font-weight:900;margin:6px auto;display:block;box-shadow:0 8px 0 #b34c86;touch-action:manipulation}
.buzz:active:not(:disabled){transform:translateY(6px);box-shadow:0 2px 0 #b34c86}
.buzz:disabled{background:#4a4a4e;box-shadow:0 8px 0 #333;color:#999}
.rank li{font-size:1.1rem}
.rank .first{color:var(--pink);font-weight:800}
.banner{background:#5a2b2b;color:#ffd0d0;text-align:center;padding:8px;font-size:.95rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="banner"></div>
<div id="app"></div>
<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const app = document.getElementById('app');
const LS = 'quiz-session';
let me = JSON.parse(localStorage.getItem(LS) || 'null'); // {role, code, token, pid}
let S = null;
let startError = '';

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const save = () => me ? localStorage.setItem(LS, JSON.stringify(me)) : localStorage.removeItem(LS);
const pname = id => { const p = S && S.players.find(x => x.id === id); return p ? p.name : '?'; };

function tryRejoin() {
  if (!me) return;
  const done = r => { if (!r.ok) { me = null; S = null; save(); render(); } };
  if (me.role === 'host') socket.emit('host:rejoin', { code: me.code, token: me.token }, done);
  else socket.emit('player:join', { code: me.code, token: me.token }, done);
}
socket.on('connect', () => { document.getElementById('banner').innerHTML = ''; tryRejoin(); });
socket.on('disconnect', () => { document.getElementById('banner').innerHTML = '<div class="banner">Verbindung verloren, verbinde neu …</div>'; });
socket.on('state', s => { S = s; render(); });
socket.on('kicked', () => { me = null; S = null; save(); startError = 'Du wurdest aus dem Raum entfernt.'; render(); });

/* ---------- Ansichten ---------- */
function render() {
  if (!me) return viewStart();
  if (!S) { app.innerHTML = '<div class="wrap center muted">Verbinde …</div>'; return; }
  const host = me.role === 'host';
  if (S.phase === 'lobby') return host ? viewHostLobby() : viewPlayerLobby();
  if (S.phase === 'game') return host ? viewHostGame() : viewPlayerGame();
  return viewEnd();
}

function viewStart() {
  const code = new URLSearchParams(location.search).get('code') || '';
  app.innerHTML = `
  <div class="wrap stack">
    <h1>Jeopardy-Quiz</h1>
    <div class="panel stack">
      <h2>Mitspielen</h2>
      <input type="text" id="jcode" placeholder="Raumcode" maxlength="4" autocapitalize="characters" autocomplete="off" value="${esc(code.toUpperCase())}">
      <input type="text" id="jname" placeholder="Dein Name" maxlength="20" autocomplete="nickname">
      <div class="err" id="err">${esc(startError)}</div>
      <button data-act="join">Beitreten</button>
    </div>
    <div class="panel stack">
      <h2>Spiel leiten</h2>
      <p class="muted" style="margin:0">Du erstellst einen Raum, siehst das Board und entscheidest über richtig oder falsch.</p>
      <button class="ghost" data-act="host">Neuen Raum erstellen</button>
    </div>
  </div>`;
  startError = '';
}

function playerList(withKick) {
  if (!S.players.length) return '<p class="muted">Noch niemand im Raum.</p>';
  return '<ul class="plist">' + S.players.map(p => `
    <li><span><span class="dot ${p.connected ? '' : 'off'}"></span>${esc(p.name)}</span>
    ${withKick ? `<button class="ghost" data-act="kick" data-id="${p.id}">Entfernen</button>` : ''}</li>`).join('') + '</ul>';
}

function viewHostLobby() {
  const link = location.origin + '/?code=' + S.code;
  const nq = S.tiles.reduce((a, c) => a + c.filter(t => t !== 'none').length, 0);
  app.innerHTML = `
  <div class="wrap stack">
    <div class="panel center">
      <div class="muted">Raumcode</div>
      <div class="code">${S.code}</div>
      <div class="muted" style="margin-bottom:10px">Spieler öffnen diese Adresse und geben den Code ein:</div>
      <div class="row" style="justify-content:center"><code style="word-break:break-all">${esc(link)}</code>
      <button class="ghost" data-act="copy" data-text="${esc(link)}">Link kopieren</button></div>
    </div>
    <div class="panel">
      <h2>Spieler (${S.players.length})</h2>
      ${playerList(true)}
    </div>
    <div class="panel stack">
      <h2>Fragen</h2>
      <div>${S.cats.length} Kategorien, ${nq} Fragen geladen.</div>
      <div class="muted">Eigene Fragen? Lade deine <code>fragen.json</code> hoch (<a href="/fragen-vorlage.json" style="color:var(--pink)">Vorlage</a>).</div>
      <input type="file" id="qfile" accept=".json,application/json">
      <div class="err" id="err"></div>
    </div>
    <button data-act="start" ${S.players.length ? '' : 'disabled'}>Spiel starten</button>
  </div>`;
  document.getElementById('qfile').onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    f.text().then(t => {
      let data; try { data = JSON.parse(t); } catch { return document.getElementById('err').textContent = 'Das ist keine gültige JSON-Datei.'; }
      socket.emit('host:setQuestions', data, r => { if (!r.ok) document.getElementById('err').textContent = r.error; });
    });
  };
}

function viewPlayerLobby() {
  app.innerHTML = `
  <div class="wrap stack center">
    <h1>Du bist drin, ${esc(me.name)}</h1>
    <p class="muted">Raum ${S.code}. Warte, bis der Host das Spiel startet.</p>
    <div class="panel" style="text-align:left"><h2>Spieler (${S.players.length})</h2>${playerList(false)}</div>
    <button class="ghost" data-act="leave">Raum verlassen</button>
  </div>`;
}

function chips() {
  return S.players.map(p => `<button class="chip ${S.picker === p.id ? 'turn' : ''} ${p.connected ? '' : 'off'}" data-act="adjust" data-id="${p.id}" title="Klicken, um Punkte zu ändern">
    ${esc(p.name)}<b>${p.score}</b></button>`).join('');
}

function viewHostGame() {
  const cols = S.cats.length;
  let head = S.cats.map(c => `<div class="cat">${esc(c)}</div>`).join('');
  let rows = '';
  S.values.forEach((v, ri) => {
    S.tiles.forEach((col, ci) => {
      const t = col[ri];
      rows += `<button class="tile ${t === 'none' ? 'none' : ''}" data-act="pick" data-c="${ci}" data-r="${ri}" ${t === 'free' && !S.current ? '' : 'disabled'} aria-label="${esc(S.cats[ci])} ${v}">${t === 'free' ? v : ''}</button>`;
    });
  });
  app.innerHTML = `
  <div class="top">
    <div class="chips">${chips()}</div>
    <div class="row"><span class="muted">Raum ${S.code}</span><button class="ghost" data-act="end">Spiel beenden</button></div>
  </div>
  <div class="board" style="--cols:${cols}">${head}${rows}</div>
  ${S.current ? hostOverlay() : ''}`;
}

function hostOverlay() {
  const c = S.current;
  let status = '', btns = '';
  if (c.state === 'reading') {
    status = 'Lies die Frage vor. Danach schaltest du den Buzzer frei.';
    btns = `<button data-act="openBuzzer">Buzzer freigeben</button><button class="ghost" data-act="skip">Überspringen</button>`;
  } else if (c.state === 'open') {
    status = 'Buzzer ist offen …' + (c.locked.length ? ` (${c.locked.length} gesperrt)` : '');
    btns = `<button class="ghost" data-act="skip">Niemand weiß es</button>`;
  } else if (c.state === 'buzzed') {
    status = `${esc(pname(c.buzzer))} hat gebuzzert.`;
    btns = `<button class="ok" data-act="judge" data-v="1">Richtig, +${c.value}</button><button class="bad" data-act="judge" data-v="0">Falsch, −${c.value}</button>`;
  } else {
    status = c.result === 'correct' ? `${esc(c.winner)} bekommt ${c.value} Punkte.` : 'Niemand hat die Frage gelöst.';
    btns = `<button data-act="close">Zurück zum Board</button>`;
  }
  return `<div class="ov"><div class="card">
    <div class="meta">${esc(c.catName)}, ${c.value} Punkte</div>
    <div class="q">${esc(c.question)}</div>
    <div class="a">Antwort: <b>${esc(c.answer)}</b></div>
    <div class="status">${status}</div>
    <div class="btns">${btns}</div>
  </div></div>`;
}

function viewPlayerGame() {
  const mine = S.players.find(p => p.id === me.pid) || { score: 0 };
  const c = S.current;
  let mid;
  if (!c) {
    mid = `<div class="wait">${S.picker ? esc(pname(S.picker)) + ' ist am Zug.' : ''}<br>Der Host wählt das nächste Feld.</div>`;
  } else {
    const locked = c.locked.includes(me.pid);
    let note = '', can = false;
    if (c.state === 'reading') note = 'Die Frage wird vorgelesen. Gleich geht der Buzzer auf.';
    else if (c.state === 'open') { can = !locked; note = locked ? 'Du hattest schon falsch geantwortet und bist raus.' : 'Buzzer ist offen!'; }
    else if (c.state === 'buzzed') note = c.buzzer === me.pid ? 'Du bist dran, antworte jetzt!' : `${esc(pname(c.buzzer))} antwortet gerade.`;
    else note = (c.result === 'correct' ? `${esc(c.winner)} hatte recht.` : 'Niemand hat es gelöst.') + ` Antwort: ${esc(c.answer)}`;
    mid = `<div class="pq"><div class="meta">${esc(c.catName)}, ${c.value} Punkte</div><div class="q">${esc(c.question)}</div></div>
      <button class="buzz" data-act="buzz" ${can ? '' : 'disabled'}>BUZZ</button>
      <div class="center" style="font-weight:700">${note}</div>`;
  }
  app.innerHTML = `${S.hostOnline ? '' : '<div class="banner">Der Host ist gerade nicht verbunden.</div>'}
  <div class="pgame">
    <div class="me"><span>${esc(me.name)}</span><b>${mine.score}</b></div>
    ${mid}
    <div class="panel"><h2>Punktestand</h2><ul class="plist rank">${
      [...S.players].sort((a, b) => b.score - a.score).map(p =>
        `<li><span>${esc(p.name)}</span><b>${p.score}</b></li>`).join('')}</ul></div>
  </div>`;
}

function viewEnd() {
  const r = [...S.players].sort((a, b) => b.score - a.score);
  app.innerHTML = `<div class="wrap stack center">
    <h1>Spiel beendet</h1>
    <div class="panel" style="text-align:left"><ul class="plist rank">${r.map((p, i) =>
      `<li class="${i === 0 ? 'first' : ''}"><span>${i + 1}. ${esc(p.name)}</span><b>${p.score}</b></li>`).join('')}</ul></div>
    <button class="ghost" data-act="leave">Zur Startseite</button>
  </div>`;
}

/* ---------- Aktionen ---------- */
document.addEventListener('pointerdown', e => {
  const el = e.target.closest('[data-act="buzz"]');
  if (el && !el.disabled) { socket.emit('player:buzz'); if (navigator.vibrate) navigator.vibrate(30); }
});
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const d = el.dataset;
  switch (d.act) {
    case 'host':
      socket.emit('host:create', r => { me = { role: 'host', code: r.code, token: r.token }; save(); });
      break;
    case 'join': {
      const code = document.getElementById('jcode').value.trim().toUpperCase();
      const name = document.getElementById('jname').value.trim();
      socket.emit('player:join', { code, name }, r => {
        if (!r.ok) return document.getElementById('err').textContent = r.error;
        me = { role: 'player', code: r.code, token: r.token, pid: r.pid, name: r.name }; save();
      });
      break;
    }
    case 'copy': navigator.clipboard && navigator.clipboard.writeText(d.text); el.textContent = 'Kopiert'; break;
    case 'start': socket.emit('host:start'); break;
    case 'pick': socket.emit('host:pick', { cat: +d.c, row: +d.r }); break;
    case 'openBuzzer': socket.emit('host:openBuzzer'); break;
    case 'judge': socket.emit('host:judge', { correct: d.v === '1' }); break;
    case 'skip': socket.emit('host:skip'); break;
    case 'close': socket.emit('host:close'); break;
    case 'kick': socket.emit('host:kick', { id: d.id }); break;
    case 'end': if (confirm('Spiel wirklich beenden?')) socket.emit('host:end'); break;
    case 'adjust': {
      const v = prompt('Punkte für ' + pname(d.id) + ' ändern (z. B. 200 oder -200). Abbrechen und stattdessen "am Zug" setzen: leer lassen.');
      if (v === null) break;
      if (v.trim() === '') socket.emit('host:setPicker', { id: d.id });
      else if (!isNaN(Number(v))) socket.emit('host:adjust', { id: d.id, delta: Number(v) });
      break;
    }
    case 'leave': me = null; S = null; save(); history.replaceState(null, '', '/'); render(); break;
  }
});
render();
</script>
</body>
</html>
